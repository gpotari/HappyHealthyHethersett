<header class="site-header" id="home">
  <div class="container nav-bar">
    <a class="site-branding" [routerLink]="['/']" (click)="closeNav()" aria-label="Happy Healthy Hethersett home">
      <span class="site-logo" aria-hidden="true">
        <span class="site-logo__leaf site-logo__leaf--one"></span>
        <span class="site-logo__leaf site-logo__leaf--two"></span>
      </span>
      <p class="site-title">Happy Healthy Hethersett</p>
    </a>
    <button
      class="nav-toggle"
      type="button"
      [attr.aria-expanded]="navOpen"
      aria-controls="primary-navigation"
      (click)="toggleNav()"
    >
      <span class="visually-hidden">Menu</span>
      <span class="nav-toggle__bar" aria-hidden="true"></span>
    </button>
    <nav class="primary-nav" aria-label="Primary">
      <ul id="primary-navigation" class="nav-list" [class.is-open]="navOpen">
        <li><a [routerLink]="['/']" (click)="closeNav()">Home</a></li>
        <li><a [routerLink]="['/']" fragment="news" (click)="closeNav()">News</a></li>
        <li><a [routerLink]="['/miyawaki-timeline']" (click)="closeNav()">Timeline</a></li>
        <li><a [routerLink]="['/']" fragment="events" (click)="closeNav()">Events</a></li>
        <li><a [routerLink]="['/']" fragment="projects" (click)="closeNav()">Projects</a></li>
        <li><a [routerLink]="['/']" fragment="contact" (click)="closeNav()">Contact</a></li>
        <li><a class="nav-list__cta" [routerLink]="['/report-litter']" (click)="closeNav()">Report litter</a></li>
      </ul>
    </nav>
  </div>
</header>
